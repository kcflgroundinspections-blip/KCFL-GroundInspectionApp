<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCFL Ground Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --pitch-900:#122f57; --pitch-800:#1c4583; --pitch-700:#1f4d96; --pitch-600:#2a5fb0;
  --turf-500:#6feef5; --turf-400:#3dd8e2;
  --chalk-50:#f7f5f0; --chalk-100:#eeece3; --chalk-200:#e2ded1;
  --ink-900:#161611; --ink-600:#4a4a42; --ink-400:#7a796d;
  --amber-500:#e8a33d; --amber-100:#fbead0;
  --red-600:#b23a48; --red-100:#f6dde0;
  --green-600:#2e7d4f; --green-100:#deefe2;
  --grey-300:#c9c7ba; --grey-100:#f0efe9;
  --radius:10px;
  --shadow:0 1px 2px rgba(18,47,87,.08), 0 4px 14px rgba(18,47,87,.06);
  --font-display:'Oswald',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-body);background:var(--chalk-50);color:var(--ink-900);}
h1,h2,h3,.display{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.02em;}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:var(--pitch-800);color:var(--chalk-50);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;row-gap:8px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow);}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;}
.topbar .crest{width:32px;height:32px;border-radius:50%;background:var(--turf-500);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--pitch-900);flex-shrink:0;}
.topbar h1{font-size:16px;margin:0;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .sub{font-size:11px;color:var(--turf-400);text-transform:none;letter-spacing:0;font-family:var(--font-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .actions{display:flex;gap:6px;flex-shrink:0;margin-left:auto;}
.topbar button.icon-btn{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--chalk-50);padding:6px 10px;border-radius:8px;font-size:12px;}
.topbar button.ghost{background:transparent;color:var(--chalk-50);border:1px solid rgba(255,255,255,.3);padding:6px 10px;border-radius:8px;}
main{flex:1;max-width:980px;width:100%;margin:0 auto;padding:16px;padding-bottom:90px;}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
.insp-list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--chalk-200);gap:10px;cursor:pointer;}
.insp-list-item:last-child{border-bottom:none;}
.insp-main{min-width:0;}
.insp-main .club{font-weight:600;font-size:15px;}
.insp-main .meta{font-size:12.5px;color:var(--ink-400);margin-top:2px;}
.tier-badges{display:flex;gap:4px;flex-shrink:0;}
.tier-badge{font-size:10px;font-weight:700;padding:3px 6px;border-radius:5px;text-transform:uppercase;}
.tier-badge.tb-pass{background:var(--green-100);color:var(--green-600);}
.tier-badge.tb-fail{background:var(--red-100);color:var(--red-600);}
.tier-badge.tb-mitigation{background:var(--amber-100);color:#8a5a10;}
.tier-badge.tb-none{background:var(--grey-100);color:var(--ink-400);}
.status-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
.status-draft{background:var(--grey-100);color:var(--ink-600);}
.status-submitted{background:var(--amber-100);color:#8a5a10;}
.status-approved{background:var(--green-100);color:var(--green-600);}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-400);}
.big-btn{width:100%;background:var(--pitch-700);color:#fff;border:none;padding:16px;border-radius:var(--radius);font-family:var(--font-display);font-size:16px;letter-spacing:.03em;text-transform:uppercase;font-weight:600;box-shadow:var(--shadow);}
.scoreboard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.score-card{background:var(--pitch-900);color:var(--chalk-50);border-radius:var(--radius);padding:10px 10px 12px;}
.score-card .tier{font-family:var(--font-display);font-size:12px;letter-spacing:.05em;color:var(--turf-400);text-transform:uppercase;}
.score-card .overall{font-family:var(--font-mono);font-weight:600;font-size:13px;margin:4px 0 8px;}
.score-row{display:flex;justify-content:space-between;font-size:11px;font-family:var(--font-mono);color:var(--chalk-200);padding:1px 0;}
.overall-pass{color:#8fe0ac;} .overall-mitigation{color:var(--amber-500);} .overall-fail{color:#f0909c;}
.section-nav{display:flex;overflow-x:auto;gap:6px;padding:2px 0 12px;margin-bottom:6px;-webkit-overflow-scrolling:touch;}
.section-nav button{flex-shrink:0;background:#fff;border:1px solid var(--chalk-200);color:var(--ink-600);padding:8px 13px;border-radius:20px;font-size:12.5px;font-weight:500;white-space:nowrap;}
.section-nav button.active{background:var(--pitch-700);color:#fff;border-color:var(--pitch-700);}
.section-nav button.done::after{content:' \2713';color:var(--turf-400);}
.section-nav button.active.done::after{color:#8fe0ac;}
.section-title{font-size:19px;margin:4px 0 14px;color:var(--pitch-800);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-900);margin-bottom:5px;}
.field .hint{font-size:11.5px;color:var(--ink-400);font-weight:400;display:block;margin-top:2px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;padding:10px 11px;border:1.5px solid var(--chalk-200);border-radius:8px;font-size:14.5px;background:#fff;color:var(--ink-900);
}
.field textarea{min-height:64px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--turf-500);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.yn-toggle{display:flex;gap:8px;}
.yn-toggle button{flex:1;padding:9px;border-radius:8px;border:1.5px solid var(--chalk-200);background:#fff;font-weight:600;font-size:13.5px;color:var(--ink-600);}
.yn-toggle button.sel-yes{background:var(--green-100);border-color:var(--green-600);color:var(--green-600);}
.yn-toggle button.sel-no{background:var(--red-100);border-color:var(--red-600);color:var(--red-600);}
.clause-card{border:1.5px solid var(--chalk-200);border-radius:var(--radius);padding:14px;margin-bottom:16px;background:var(--chalk-50);}
.clause-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.clause-id{font-family:var(--font-mono);font-size:11px;color:var(--ink-400);}
.clause-title{font-weight:700;font-size:14.5px;color:var(--pitch-800);}
.clause-req{font-size:12px;color:var(--ink-600);margin-top:3px;line-height:1.4;}
.grade-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.grade-badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;text-transform:uppercase;letter-spacing:.02em;}
.grade-pass{background:var(--green-100);color:var(--green-600);}
.grade-fail{background:var(--red-100);color:var(--red-600);}
.grade-mitigation{background:var(--amber-100);color:#8a5a10;}
.grade-na{background:var(--grey-100);color:var(--ink-400);}
.mitigation-box{margin-top:10px;background:var(--amber-100);border-radius:8px;padding:10px;}
.mitigation-box label{font-size:11.5px;color:#8a5a10;}
.mitigation-box .due-row{display:flex;gap:8px;align-items:center;margin-top:6px;}
.mitigation-box .due-row input{padding:6px 8px;border-radius:6px;border:1px solid var(--grey-300);font-size:12.5px;}
.advisory-box{margin-top:10px;background:#e4ecf7;border-radius:8px;padding:10px;font-size:12.5px;color:#2b5aa0;}
.override-btn{font-size:10.5px;background:none;border:none;color:var(--ink-400);text-decoration:underline;padding:0;}
.override-panel{margin-top:10px;background:#fff;border:1px dashed var(--grey-300);border-radius:8px;padding:10px;}
.footer-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--chalk-200);padding:10px 16px;display:flex;gap:10px;justify-content:center;box-shadow:0 -2px 10px rgba(0,0,0,.06);z-index:40;}
.footer-bar button{flex:1;max-width:220px;padding:12px;border-radius:8px;font-weight:600;font-size:13.5px;border:none;}
.btn-primary{background:var(--pitch-700);color:#fff;}
.btn-secondary{background:var(--chalk-100);color:var(--ink-900);}
.summary-table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0;}
.summary-table th,.summary-table td{border:1px solid var(--chalk-200);padding:7px 9px;text-align:left;}
.summary-table th{background:var(--chalk-100);font-family:var(--font-display);font-size:11px;letter-spacing:.03em;text-transform:uppercase;}
.summary-table td.num{text-align:center;font-family:var(--font-mono);}
.assessment-tag{font-weight:700;padding:4px 8px;border-radius:6px;font-size:11.5px;}
.notice-item{border:1px solid var(--chalk-200);border-radius:8px;padding:10px;margin-bottom:8px;}
.notice-item .clause{font-weight:700;font-size:13px;}
.notice-item .text{font-size:13px;margin:4px 0;}
.notice-item .row{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink-400);flex-wrap:wrap;}
.notice-item input[type=date]{padding:5px 7px;border-radius:6px;border:1px solid var(--grey-300);}
.print-report{background:#fff;padding:18px;border-radius:var(--radius);box-shadow:var(--shadow);}
.print-report h2{color:var(--pitch-800);font-size:20px;}
.kv-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:16px;}
.kv-table td{border:1px solid var(--chalk-200);padding:7px 9px;vertical-align:top;}
.kv-table td.k{font-weight:600;width:38%;background:var(--chalk-50);}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--pitch-900);color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
.sync-ok{background:#8fe0ac;} .sync-pending{background:var(--amber-500);} .sync-off{background:var(--grey-300);}
.setup-wrap{max-width:440px;margin:60px auto;padding:20px;}
.tab-btn{flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--chalk-200);background:#fff;font-weight:600;font-size:13.5px;color:var(--ink-600);}
.tab-btn.active{background:var(--pitch-700);color:#fff;border-color:var(--pitch-700);}
.tier-check-row{display:flex;gap:10px;margin-bottom:14px;}
.tier-check{flex:1;display:flex;align-items:center;gap:6px;padding:9px;border:1.5px solid var(--chalk-200);border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-600);}
#search-map{height:320px;border-radius:var(--radius);margin-top:12px;overflow:hidden;box-shadow:var(--shadow);}
.search-result-item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--chalk-200);gap:10px;cursor:pointer;}
.search-result-item .dist{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-400);white-space:nowrap;}
@media print{
  .topbar,.footer-bar,.section-nav,.no-print{display:none !important;}
  main{max-width:100%;padding:0;}
  body{background:#fff;}
}
</style>
</head>

/* =========================================================================
   CONFIG (per-device: which Google Sheet backend to talk to)
   ========================================================================= */
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbzld0MOmjw-kdnn6LXx636d-74okFk7SpOHNxTX01XysMZ_46Bdjju6qUXvMd492qnyQw/exec';
function getConfig(){
  try{
    const raw = localStorage.getItem('kcfl-config');
    const cfg = raw ? JSON.parse(raw) : null;
    if(!cfg || !cfg.secret) return null;
    return { apiUrl: DEFAULT_API_URL, secret: cfg.secret };
  }catch(e){ return null; }
}
function setConfig(cfg){ localStorage.setItem('kcfl-config', JSON.stringify({secret: cfg.secret})); }

/* =========================================================================
   API — talks to the Google Apps Script backend
   ========================================================================= */
const CHUNK_SIZE = 3000; // raw chars per chunk - conservative, well under safe URL length limits

const Api = {
  async call(action, payload){
    const cfg = getConfig();
    if(!cfg || !cfg.apiUrl) throw new Error('Not configured');
    const payloadStr = (payload && Object.keys(payload).length) ? JSON.stringify(payload) : '';

    if(payloadStr.length <= CHUNK_SIZE){
      const params = new URLSearchParams();
      params.set('action', action);
      params.set('secret', cfg.secret||'');
      if(payloadStr) params.set('payload', payloadStr);
      const res = await fetch(cfg.apiUrl + '?' + params.toString(), { method:'GET' });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      if(data && data.error) throw new Error(data.error);
      return data;
    }

    // payload too large for one GET URL - split into chunks the server reassembles
    const chunkId = 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    const total = Math.ceil(payloadStr.length / CHUNK_SIZE);
    for(let i=0; i<total; i++){
      const chunk = payloadStr.slice(i*CHUNK_SIZE, (i+1)*CHUNK_SIZE);
      const params = new URLSearchParams({action:'uploadChunk', secret:cfg.secret||'', chunkId, index:String(i), data:chunk});
      const res = await fetch(cfg.apiUrl + '?' + params.toString(), { method:'GET' });
      if(!res.ok) throw new Error('HTTP '+res.status+' (chunk '+i+'/'+total+')');
      const data = await res.json();
      if(data && data.error) throw new Error('Chunk '+i+': '+data.error);
    }
    const commitParams = new URLSearchParams({action:'commitChunked', secret:cfg.secret||'', realAction:action, chunkId, total:String(total)});
    const res = await fetch(cfg.apiUrl + '?' + commitParams.toString(), { method:'GET' });
    if(!res.ok) throw new Error('HTTP '+res.status+' (commit)');
    const data = await res.json();
    if(data && data.error) throw new Error(data.error);
    return data;
  },
  listGrounds(){ return this.call('listGrounds'); },
  saveGround(record){ return this.call('saveGround', {record}); },
  listInspections(groundId){ return this.call('listInspections', groundId?{groundId}:{}); },
  getInspection(id){ return this.call('getInspection', {id}); },
  saveInspection(record){ return this.call('saveInspection', {record}); },
  listNotices(){ return this.call('listNotices'); },
  saveNotice(record){ return this.call('saveNotice', {record}); },
  listAmendments(inspectionId){ return this.call('listAmendments', inspectionId?{inspectionId}:{}); },
  saveAmendment(record){ return this.call('saveAmendment', {record}); },
  listClubs(){ return this.call('listClubs'); },
  saveClub(record){ return this.call('saveClub', {record}); },
  listTenancies(groundId){ return this.call('listTenancies', groundId?{groundId}:{}); },
  saveTenancy(record){ return this.call('saveTenancy', {record}); },
  deleteGround(id){ return this.call('deleteGround', {id}); },
  deleteClub(id){ return this.call('deleteClub', {id}); },
  deleteTenancy(id){ return this.call('deleteTenancy', {id}); }
};

/* =========================================================================
   LOCAL CACHE (offline-first: every change saves here immediately;
   background sync pushes to Sheets and clears the dirty flag on success)
   ========================================================================= */
const Local = {
  get(key){ try{ const r = localStorage.getItem(key); return r?JSON.parse(r):null; }catch(e){ return null; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.error(e); } },
  index(name){ const v = this.get('idx:'+name); return Array.isArray(v) ? v : []; },
  setIndex(name, arr){ this.set('idx:'+name, arr); },
};

function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return '\u2014'; try{ return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;} }
function isHistorical(visitDate){ return !!visitDate && visitDate < '2026-04-01'; }
function currentClubsFor(groundId, tenancies){
  return tenancies.filter(t=>t.groundId===groundId && t.status==='current').map(t=>t.clubName).filter(Boolean);
}
function currentClubsLabel(groundId, tenancies){
  const clubs = currentClubsFor(groundId, tenancies);
  return clubs.length ? clubs.join(', ') : 'Not currently used';
}
function isUninspectedNonNLS(g){ return !g.lastInspectionId && g.nlsStatus!=='Currently NLS'; }

async function renderUninspectedGrounds(){
  const allGrounds = await Store.listGrounds();
  const grounds = allGrounds.filter(isUninspectedNonNLS);
  const rows = grounds.length ? grounds.map(g=>`
    <div class="insp-list-item">
      <div class="insp-main" data-open-ground="${g.id}" style="cursor:pointer;">
        <div class="club">${esc(g.groundName||g.clubName||'(unnamed ground)')}</div>
        <div class="meta">${esc([g.streetAddress, g.cityTown, g.postcode].filter(Boolean).join(', '))||'No address on file'}</div>
      </div>
      <button class="btn-secondary" style="padding:6px 12px;" data-delete-ground="${g.id}">Delete</button>
    </div>`).join('') : `<div class="empty-state">Nothing here \u2014 every ground either has an inspection or is marked NLS.</div>`;
  return `<div class="topbar"><div class="brand"><button class="ghost" data-back-dashboard style="padding:6px 10px;">\u2190</button><h1 style="font-size:14px;">Not Yet Inspected</h1></div></div>
  <main>
    <div class="card">
      <p style="font-size:12.5px;color:var(--ink-400);">Grounds with no inspection on record, and not marked NLS. These are excluded from the main Grounds list until inspected. Tap a ground to open it and start an inspection, or delete it here if it shouldn't be on the system.</p>
    </div>
    <div class="card">${rows}</div>
  </main>`;
}

/* =========================================================================
   GROUND & INSPECTION STORE — local-first, background sync to Sheets
   ========================================================================= */
const Store = {
  async listGrounds(){
    let idx = Local.index('grounds');
    try{
      const remote = await Api.listGrounds();
      const dirtyIds = new Set(idx.filter(g=>g._dirty).map(g=>g.id));
      const merged = remote.filter(g=>!dirtyIds.has(g.id));
      const dirtyLocal = idx.filter(g=>dirtyIds.has(g.id));
      idx = [...dirtyLocal, ...merged];
      Local.setIndex('grounds', idx);
      SYNC_STATE.online = true;
    }catch(e){ SYNC_STATE.online = false; console.warn('listGrounds offline', e); }
    return idx.filter(g=>!g.mergedInto).sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
  },
  async listAllGroundsIncludingMerged(){
    let idx = Local.index('grounds');
    try{
      const remote = await Api.listGrounds();
      idx = remote;
      Local.setIndex('grounds', idx);
      SYNC_STATE.online = true;
    }catch(e){ SYNC_STATE.online = false; console.warn('listGrounds offline', e); }
    return idx;
  },
  async saveGround(ground){
    ground.updatedAt = Date.now();
    ground._dirty = true;
    let idx = Local.index('grounds');
    const i = idx.findIndex(g=>g.id===ground.id);
    if(i>=0) idx[i]=ground; else idx.unshift(ground);
    Local.setIndex('grounds', idx);
    try{
      await Api.saveGround(stripLocal(ground));
      ground._dirty = false;
      idx = Local.index('grounds'); const j = idx.findIndex(g=>g.id===ground.id); if(j>=0){ idx[j]=ground; Local.setIndex('grounds', idx); }
      SYNC_STATE.online = true;
    }catch(e){ SYNC_STATE.online = false; console.warn('saveGround offline, queued', e); }

function serializeInspectionRecord(insp){
  const grades = computeGrades(insp.facts, insp.overrides||{});
  const summary = summarise(grades);
  const rec = {
    id: insp.id, groundId: insp.groundId, visitDate: insp.facts.visitDate||'',
    inspector1: insp.facts.inspector1||'', inspector1Email: insp.facts.inspector1Email||'',
    inspector2: insp.facts.inspector2||'', inspector2Email: insp.facts.inspector2Email||'',
    status: insp.status,
    premOverall: summary.prem.overall, premPass: summary.prem.pass, premMitigation: summary.prem.mitigation, premFail: summary.prem.fail, premNA: summary.prem.na,
    nonPremOverall: summary.nonprem.overall, nonPremPass: summary.nonprem.pass, nonPremMitigation: summary.nonprem.mitigation, nonPremFail: summary.nonprem.fail, nonPremNA: summary.nonprem.na,
    vetsOverall: summary.vets.overall, vetsPass: summary.vets.pass, vetsMitigation: summary.vets.mitigation, vetsFail: summary.vets.fail, vetsNA: summary.vets.na,
    submittedAt: insp.submittedAt||'', approvedAt: insp.approvedAt||'', approvedBy: insp.approvedBy||'',
    factsJson: JSON.stringify({facts:insp.facts, overrides:insp.overrides||{}, lastAmendedBy:insp.lastAmendedBy||'', lastAmendedAt:insp.lastAmendedAt||''})
  };
  FACT_COLUMNS.forEach(k=>{ rec[k] = insp.facts[k] ?? ''; });
  return rec;
}
function parseInspectionRecord(rec){
  let facts = {}, overrides = {}, lastAmendedBy = '', lastAmendedAt = '';
  try{
    const parsed = JSON.parse(rec.factsJson||'{}');
    facts = parsed.facts||{}; overrides = parsed.overrides||{};
    lastAmendedBy = parsed.lastAmendedBy||''; lastAmendedAt = parsed.lastAmendedAt||'';
  }catch(e){}
  return {
    id: rec.id, groundId: rec.groundId, status: rec.status||'draft',
    facts, overrides, lastAmendedBy, lastAmendedAt,
    submittedAt: rec.submittedAt, approvedAt: rec.approvedAt, approvedBy: rec.approvedBy,
    updatedAt: rec.updatedAt || Date.now(), _dirty:false
  };
}

/* =========================================================================
   GEOCODING — postcodes.io (free, no key), cached locally
   ========================================================================= */
const Geocode = {
  cache(){ try{ return JSON.parse(localStorage.getItem('kcfl-geocode-cache')||'{}'); }catch(e){ return {}; } },
  saveCache(c){ try{ localStorage.setItem('kcfl-geocode-cache', JSON.stringify(c)); }catch(e){} },
  async lookupOne(postcode){
    const norm = (postcode||'').trim().toUpperCase();
    if(!norm) throw new Error('Enter a postcode');
    const cache = this.cache();
    if(cache[norm]) return cache[norm];
    const res = await fetch('https://api.postcodes.io/postcodes/'+encodeURIComponent(norm));
    const data = await res.json();
    if(data.status!==200 || !data.result) throw new Error('Postcode not found');
    const coords = {lat:data.result.latitude, lng:data.result.longitude};
    cache[norm] = coords; this.saveCache(cache);
    return coords;
  },
  async lookupBulk(postcodes){
    const cache = this.cache();
    const norms = [...new Set(postcodes.map(p=>(p||'').trim().toUpperCase()).filter(Boolean))];
    const uncached = norms.filter(p=>!cache[p]);
    for(let i=0;i<uncached.length;i+=100){
      const batch = uncached.slice(i,i+100);
      try{
        const res = await fetch('https://api.postcodes.io/postcodes', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({postcodes:batch})
        });
        const data = await res.json();
        for(const item of (data.result||[])){
          if(item.result) cache[item.query.trim().toUpperCase()] = {lat:item.result.latitude, lng:item.result.longitude};
        }
      }catch(e){ console.warn('bulk geocode batch failed', e); }
    }
    this.saveCache(cache);
    return cache;
  }
};
function haversineMiles(lat1, lon1, lat2, lon2){
  const R = 3958.8;
  const toRad = d => d * Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function computeGrades(facts, overrides){
  overrides = overrides || {};
  const results = {};
  for(const cid in CLAUSES){
    let g = CLAUSES[cid].grade(facts);
    if(overrides[cid]){
      g = Object.assign({}, g, overrides[cid].tiers);
      g._overridden = true;
      g._overrideReason = overrides[cid].reason;
      if(overrides[cid].mitigationNote) g.mitigationNote = overrides[cid].mitigationNote;
    }
    results[cid] = g;
  }
  return results;
}
function summarise(grades){
  const summary = {};
  for(const tier of TIERS){
    let na=0,pass=0,mitigation=0,fail=0;
    for(const cid in grades){
      const c = CLAUSES[cid];
      if(c.tiersApplicable && !c.tiersApplicable.includes(tier)) continue;
      const v = grades[cid][tier];
      if(v==='na') na++; else if(v==='pass') pass++; else if(v==='mitigation') mitigation++; else if(v==='fail') fail++;
    }
    let overall='Pass';
    if(fail>0) overall='Fail'; else if(mitigation>0) overall='Pass subject to mitigation';
    summary[tier] = {na,pass,mitigation,fail,overall};
  }
  return summary;
}
const ANSWER_SUMMARY = {
'1.1': f => f.tenureSecured!=='yes' ? 'Tenure secured: No' : `Tenure secured: Yes; Evidence provided: ${ynLabel(f.tenureEvidence)}`,
'1.2': f => f.groundShares!=='yes' ? 'No groundshare' : `Groundshare: Yes; Sole control matchday: ${ynLabel(f.groundShareSoleControl)}`,
'1.5': f => f.clubhouseExists==='yes' ? `Clubhouse: Yes; Open matchday: ${ynLabel(f.clubhouseOpenMatchday)}` : `Clubhouse: No; Off-site alt: ${ynLabel(f.clubhouseOffsiteAlt)}`,
'1.6': f => `Parking spaces: ${f.parkingSpaces||'\u2014'}`,
'1.7': f => `Barrier: ${f.barrierType||'\u2014'}; Full perimeter: ${ynLabel(f.barrierFullPerimeter)}`,
'1.9': f => `Length: ${f.pitch1Length||'\u2014'}m; Width: ${f.pitch1Width||'\u2014'}m`,
'1.10': f => `Marked out: ${ynLabel(f.techAreaMarked)}; Dugouts in place: ${ynLabel(f.techAreaDugouts)}`,
'1.11': f => `Walkway clear: ${ynLabel(f.walkwayClear)}; Stewarding: ${ynLabel(f.walkwayStewarding)}`,
'2.3': f => `Shared with spectators: ${ynLabel(f.toiletsSharedSpectators)}`,
'3.1': f => `Home area: ${f.homeRoomArea||'\u2014'}sqm; Away area: ${f.awayRoomArea||'\u2014'}sqm`,
'3.1.1': f => f.showersShared==='yes' ? `Shared: Yes; Total heads: ${f.sharedShowerHeads||'\u2014'}` : `Shared: No; Home: ${f.homeShowerHeads||'\u2014'}; Away: ${f.awayShowerHeads||'\u2014'}`,
'3.1.2': f => (f.toiletsShared==='yes' ? `Shared: Yes; Total WCs: ${f.sharedWC||'\u2014'}` : `Shared: No; Home WCs: ${f.homeWC||'\u2014'}; Away WCs: ${f.awayWC||'\u2014'}`) + `; Lockable door: ${ynLabel(f.toiletsLockable)}`,
'3.2': f => `Hot & cold water: ${ynLabel(f.hotColdWaterChanging)}`,
'3.3size': f => `Room area: ${f.officialsRoomArea||'\u2014'}sqm; Seating for 3: ${ynLabel(f.officialsSeating3)}`,
'3.3sanitary': f => `WCs: ${f.officialsWC||'\u2014'}; Basins: ${f.officialsBasin||'\u2014'}; Hot & cold: ${ynLabel(f.officialsHotCold)}`,
'3.3shower': f => `Heads: ${f.officialsShowerHeads||'\u2014'}; Shared: ${ynLabel(f.officialsShowerShared)}${f.officialsShowerShared==='yes' ? '; Via players\u2019 rooms: '+ynLabel(f.officialsShowerViaPlayers) : ''}`,
'3.3mf': f => f.officialsFemaleYouthSeparate==='yes' ? 'Separate facilities: Yes' : `Separate facilities: No; Details: ${f.officialsFemaleYouthDetails||'\u2014'}`,
};
function ynLabel(v){ return v==='yes'?'Yes':(v==='no'?'No':'\u2014'); }
function answerSummary(cid, facts){ const fn = ANSWER_SUMMARY[cid]; return fn ? fn(facts) : '\u2014'; }
function mitigateFailingTiers(cid, facts, note, reason){
  const base = CLAUSES[cid].grade(facts);
  const tiers = {};
  let changed = false;
  for(const t of ['prem','nonprem','vets']){
    if(base[t]==='fail'){ tiers[t] = 'mitigation'; changed = true; }
    else tiers[t] = base[t];
  }
  return changed ? { tiers, reason, mitigationNote: note } : null;
}
function computeHistoricalOverrides(facts){
  const overrides = {};

  overrides['3.3size'] = { tiers:{prem:'mitigation',nonprem:'mitigation',vets:'mitigation'}, reason:'Not recorded on the old inspection form (seating for 3 officials was not asked).', mitigationNote:'Not specifically inspected, but assumed to comply.' };
  overrides['1.11'] = { tiers:{prem:'mitigation',nonprem:'na',vets:'na'}, reason:'Not recorded on the old inspection form (walkway/stewarding was not asked).', mitigationNote:'Not specifically inspected, but assumed to comply.' };
  if(facts.clubhouseExists==='yes'){
    overrides['1.5'] = { tiers:{prem:'mitigation',nonprem:'mitigation',vets:'pass'}, reason:'Not recorded on the old inspection form (whether open on matchday was not asked).', mitigationNote:'Not specifically inspected, but assumed to comply.' };
  }
  if(facts.officialsFemaleYouthSeparate!=='yes' && !facts.officialsFemaleYouthDetails){
    overrides['3.3mf'] = { tiers:{prem:'mitigation',nonprem:'mitigation',vets:'mitigation'}, reason:'Not recorded on the old inspection form (any alternative arrangement was not asked).', mitigationNote:'Detail not given but club to provide provision as required.' };
  }
  if(facts.tenureSecured !== 'yes'){
    overrides['1.1'] = { tiers:{prem:'mitigation',nonprem:'mitigation',vets:'mitigation'}, reason:'Tenure status not clearly recorded on the old inspection form.', mitigationNote:'Club to confirm at least one season\u2019s tenure secured.' };
  }

  const carParking = mitigateFailingTiers('1.6', facts, 'Club to provide instructions to away team regarding parking.', 'Below minimum car parking standard on old inspection.');
  if(carParking) overrides['1.6'] = carParking;

  const barrier = mitigateFailingTiers('1.7', facts, 'A temporary barrier should be erected before all matches.', 'Perimeter barrier did not meet standard on old inspection.');
  if(barrier) overrides['1.7'] = barrier;

  const techArea = mitigateFailingTiers('1.10', facts, 'Temporary technical area to be marked out and dugouts to be provided in accordance with ground standards.', 'Technical area/dugouts not recorded as compliant on old inspection.');
  if(techArea) overrides['1.10'] = techArea;

  const sharedSpectatorToilets = mitigateFailingTiers('2.3', facts, 'Toilets should not be used by spectators before and after the game.', 'Changing room toilets recorded as shared with spectators on old inspection.');
  if(sharedSpectatorToilets) overrides['2.3'] = sharedSpectatorToilets;

  const hotColdChanging = mitigateFailingTiers('3.2', facts, 'Not noted in inspection but assumed to be provided.', 'Hot & cold water not recorded on old inspection.');
  if(hotColdChanging) overrides['3.2'] = hotColdChanging;

  // Officials WC/basin/hot&cold: mitigate basin/hot&cold only when the WC count itself is fine (WC shortfall stays a hard fail)
  const offWC = parseFloat(facts.officialsWC)||0;
  const offBasin = parseFloat(facts.officialsBasin)||0;
  if(offWC>=1 && !(offBasin>=1 && facts.officialsHotCold==='yes')){
    overrides['3.3sanitary'] = { tiers:{prem:'mitigation',nonprem:'mitigation',vets:'mitigation'}, reason:'Officials\u2019 basin/hot & cold water not recorded on old inspection (WC count was adequate).', mitigationNote:'Not inspected and assumed to be provided.' };
  }

  return overrides;
}
function gradeLabel(v){ return {pass:'Pass',fail:'Fail',mitigation:'Mitigation',na:'N/A'}[v] || v; }

function tierBadge(val){
  const cls = val==='Fail' ? 'tb-fail' : (val==='Pass subject to mitigation' ? 'tb-mitigation' : (val==='Pass' ? 'tb-pass' : 'tb-none'));

  return `<span class="tier-badge ${cls}">${label}</span>`;
}
function tierKey(s){ return {prem:'Prem', nonprem:'NonPrem', vets:'Vets'}[s] || s; }

/* ---------- Inspection form ---------- */
async function loadCurrentInspection(){
  if(STATE.cache[STATE.inspectionId]) return STATE.cache[STATE.inspectionId];
  let insp = await Store.getInspection(STATE.inspectionId);
  if(!insp) insp = { id:STATE.inspectionId, groundId:STATE.groundId, status:'draft', facts:{}, overrides:{}, createdAt:Date.now() };
  STATE.cache[insp.id] = insp;
  return insp;
}

async function renderInspection(){
  const insp = await loadCurrentInspection();
  const grades = computeGrades(insp.facts, insp.overrides);
  const summary = summarise(grades);
  const section = SECTIONS[STATE.sectionIdx];
  const visible = !section.showIf || section.showIf(insp.facts);
  const nav = SECTIONS.map((s,i)=>{
    if(s.showIf && !s.showIf(insp.facts)) return '';
    const done = s.fields.some(f=>f.k && insp.facts[f.k]);
    return `<button data-section="${i}" class="${i===STATE.sectionIdx?'active':''} ${done?'done':''}">${s.title}</button>`;
  }).join('');
  const fieldsHtml = visible ? section.fields.map(f=>renderField(f, insp.facts, grades)).join('') : `<p style="color:var(--ink-400);font-size:13px;">Not applicable (no 2nd pitch recorded).</p>`;

  return `
  <div class="topbar">
    <div class="brand"><button class="ghost" data-back-ground="${insp.groundId}" style="padding:6px 10px;">\u2190</button>
      <div><h1 style="font-size:14px;">${esc(insp.facts.clubName||'Inspection')}</h1><div class="sub">${insp._dirty?'<span class="sync-dot sync-pending"></span>syncing\u2026':'<span class="sync-dot sync-ok"></span>synced'}</div></div>
    </div>
    <span class="status-pill status-${insp.status}">${insp.status}</span>
  </div>
  <main>
    ${STATE.amending ? `<div class="advisory-box" style="margin-bottom:12px;">\u270f\ufe0f Amending as <b>${esc(STATE.amenderName)}</b> \u2014 saving will update this ${insp.status} record and log every changed field to the audit trail.</div>` : ''}
    <div class="scoreboard">
      ${TIERS.map(t=>`<div class="score-card"><div class="tier">${TIER_LABEL[t]}</div>
        <div class="overall overall-${summary[t].overall==='Pass'?'pass':summary[t].overall==='Fail'?'fail':'mitigation'}">${summary[t].overall}</div>
        <div class="score-row"><span>Pass</span><span>${summary[t].pass}</span></div>
        <div class="score-row"><span>Mitigation</span><span>${summary[t].mitigation}</span></div>
        <div class="score-row"><span>Fail</span><span>${summary[t].fail}</span></div>
        <div class="score-row"><span>N/A</span><span>${summary[t].na}</span></div></div>`).join('')}
    </div>
    <div class="section-nav">${nav}</div>
    <div class="card"><h2 class="section-title">${section.title}</h2>${fieldsHtml}</div>
  </main>
  <div class="footer-bar">
    <button class="btn-secondary" data-prev-section>\u2190 Prev</button>
    ${STATE.amending
      ? `<button class="btn-primary" data-save-amendment>Save Amendment</button>`
      : (STATE.sectionIdx < SECTIONS.length-1 ? `<button class="btn-primary" data-next-section>Next \u2192</button>` : `<button class="btn-primary" data-goto-summary>On-site Summary \u2192</button>`)
    }
  </div>`;
}

function renderField(f, facts, grades){
  if(f.clause) return renderClauseCard(f.clause, facts, grades);
  if(f.showIf && !f.showIf(facts)) return '';
  const val = facts[f.k] ?? '';
  let input='';
  if(f.type==='text'||f.type==='number'||f.type==='date') input = `<input type="${f.type}" data-field="${f.k}" value="${esc(val)}">`;
  else if(f.type==='textarea') input = `<textarea data-field="${f.k}">${esc(val)}</textarea>`;
  else if(f.type==='select'){
    const opts = f.options.map(o=>{ const [ov,ol]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(ov)}" ${val===ov?'selected':''}>${esc(ol)}</option>`; }).join('');
    input = `<select data-field="${f.k}"><option value="">\u2014 select \u2014</option>${opts}</select>`;
  } else if(f.type==='yn'){
    input = `<div class="yn-toggle"><button type="button" class="${val==='yes'?'sel-yes':''}" data-field="${f.k}" data-val="yes">Yes</button><button type="button" class="${val==='no'?'sel-no':''}" data-field="${f.k}" data-val="no">No</button></div>`;
  }
  return `<div class="field"><label>${esc(f.label)}${f.unit?` <span class="hint">(${f.unit})</span>`:''}</label>${input}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
}

function renderClauseCard(cid, facts, grades){
  const c = CLAUSES[cid], g = grades[cid];
  const applicable = t => !c.tiersApplicable || c.tiersApplicable.includes(t);
  const badges = TIERS.filter(applicable).map(t=>`<span class="grade-badge grade-${g[t]}">${TIER_LABEL[t]}: ${gradeLabel(g[t])}</span>`).join('');
  let mitigationHtml='';
  if(g.mitigationNote){
    mitigationHtml = `<div class="mitigation-box"><label>Mitigation</label><textarea data-mitigation="${cid}">${esc(facts['_mit_'+cid] ?? g.mitigationNote)}</textarea>
      <div class="due-row"><span>Due by:</span><input type="date" data-duedate="${cid}" value="${esc(facts['_due_'+cid]||'')}"></div></div>`;
  }
  let advisoryHtml = g.advisories ? g.advisories.map(a=>`<div class="advisory-box">\u2139 Advisory (${TIER_LABEL[a.tier]}): ${esc(a.text)}</div>`).join('') : '';
  return `<div class="clause-card">
    <div class="clause-head"><div><div class="clause-id">Clause ${cid.replace(/[a-z]+$/,'')}</div><div class="clause-title">${esc(c.title)}</div><div class="clause-req">${esc(c.req)}</div></div></div>
    <div class="grade-row">${badges}</div>${mitigationHtml}${advisoryHtml}
    <button class="override-btn" data-override="${cid}">${g._overridden?'Editing manual override':'Manually override grading'}</button>
    ${STATE.overridingClause===cid ? renderOverridePanel(cid,g) : ''}
  </div>`;
}
function renderOverridePanel(cid, g){
  const c = CLAUSES[cid];
  const tiers = TIERS.filter(t=>!c.tiersApplicable || c.tiersApplicable.includes(t));
  return `<div class="override-panel">
    ${tiers.map(t=>`<label style="font-size:11.5px;">${TIER_LABEL[t]}</label><select data-override-tier="${cid}|${t}">${['pass','mitigation','fail','na'].map(v=>`<option value="${v}" ${g[t]===v?'selected':''}>${gradeLabel(v)}</option>`).join('')}</select>`).join('')}
    <label style="font-size:11.5px;">Reason for override</label><textarea data-override-reason="${cid}" placeholder="Why is this being overridden?"></textarea>
    <button class="btn-primary" style="margin-top:6px;padding:8px;font-size:12px;" data-apply-override="${cid}">Apply Override</button>
  </div>`;
}

/* ---------- On-site summary ---------- */
async function renderOnsiteSummary(){
  const insp = await loadCurrentInspection();
  const grades = computeGrades(insp.facts, insp.overrides);
  const summary = summarise(grades);
  const notices = buildNotices(grades, insp.facts);
  return `
  <div class="topbar"><div class="brand"><button class="ghost" data-back-inspection style="padding:6px 10px;">\u2190</button><h1 style="font-size:14px;">On-site Summary</h1></div></div>
  <main><div class="print-report">
    <h2>${esc(insp.facts.groundName||insp.facts.clubName||'')}</h2>
    <p style="color:var(--ink-400);font-size:13px;">Visit date: ${fmtDate(insp.facts.visitDate)} &nbsp;\u2022&nbsp; For discussion with club representative on site</p>
    <table class="summary-table"><tr><th></th>${TIERS.map(t=>`<th>${TIER_LABEL[t]}</th>`).join('')}</tr>
      <tr><td>N/A</td>${TIERS.map(t=>`<td class="num">${summary[t].na}</td>`).join('')}</tr>
      <tr><td>Pass</td>${TIERS.map(t=>`<td class="num">${summary[t].pass}</td>`).join('')}</tr>
      <tr><td>Pass with mitigation</td>${TIERS.map(t=>`<td class="num">${summary[t].mitigation}</td>`).join('')}</tr>
      <tr><td>Fail</td>${TIERS.map(t=>`<td class="num">${summary[t].fail}</td>`).join('')}</tr>
      <tr><td><b>Overall</b></td>${TIERS.map(t=>`<td><span class="assessment-tag" style="background:${summary[t].overall==='Pass'?'var(--green-100)':summary[t].overall==='Fail'?'var(--red-100)':'var(--amber-100)'};color:${summary[t].overall==='Pass'?'var(--green-600)':summary[t].overall==='Fail'?'var(--red-600)':'#8a5a10'}">${summary[t].overall}</span></td>`).join('')}</tr>
    </table>
    <h3 style="font-size:15px;color:var(--pitch-800);">Improvement Notices / Mitigations</h3>
    ${notices.length ? notices.map(n=>`<div class="notice-item"><div class="clause">${n.title}</div><div class="text">${esc(n.text)}</div>${n.dueDate?`<div class="row">Due: ${fmtDate(n.dueDate)}</div>`:''}</div>`).join('') : '<p style="font-size:13px;color:var(--ink-400);">None recorded.</p>'}
  </div></main>
  <div class="footer-bar no-print">
    <button class="btn-secondary" onclick="window.print()">Print</button>
    <button class="btn-primary" data-submit-approval>Submit for Approval</button>
  </div>`;
}
function buildNotices(grades, facts){
  const notices = [];
  for(const cid in grades){
    const g = grades[cid], c = CLAUSES[cid];
    const hasMitigation = TIERS.some(t=>g[t]==='mitigation');
    const hasFail = TIERS.some(t=>g[t]==='fail');
    if(hasMitigation && g.mitigationNote){
      notices.push({cid, title:`${c.title} \u2014 Mitigation`, type:'mitigation', text: facts['_mit_'+cid] || g.mitigationNote, dueDate: facts['_due_'+cid]||''});
    } else if(hasFail){
      notices.push({cid, title:`${c.title} \u2014 Improvement Required`, type:'fail', text:`Does not currently meet the required standard.`, dueDate: facts['_due_'+cid]||''});
    }
  }
  return notices;
}

async function renderCompliance(){
  const clubs = (await Store.listClubs()).filter(c=>c.status && c.status!=='Not Current');
  const tenancies = await Store.listTenancies();
  const grounds = await Store.listAllGroundsIncludingMerged();
  const groundsById = Object.fromEntries(grounds.map(g=>[g.id,g]));
  const divKey = d => ({'Prem':'currentAssessmentPrem','Non-Prem':'currentAssessmentNonPrem','Vets':'currentAssessmentVets'})[d];

  const failing = [], mitigated = [], noGround = [], ok = [];
  for(const c of clubs){
    const current = tenancies.filter(t=>t.clubName===c.clubName && t.status==='current');
    if(!current.length){ noGround.push(c); continue; }
    const g = groundsById[current[0].groundId];
    if(!g){ noGround.push(c); continue; }
    const grade = g[divKey(c.status)];
    if(grade==='Fail') failing.push({c,g});
    else if(grade==='Pass subject to mitigation') mitigated.push({c,g});
    else if(grade==='Pass') ok.push({c,g});
    else noGround.push(c);
  }

  const section = (title, items, renderItem, emptyMsg) => `
    <div class="card">
      <h2 class="section-title" style="margin-top:0">${title} (${items.length})</h2>
      ${items.length ? items.map(renderItem).join('') : `<div class="empty-state">${emptyMsg}</div>`}
    </div>`;

  return `<div class="topbar"><div class="brand"><button class="ghost" data-back-dashboard style="padding:6px 10px;">\u2190</button><h1 style="font-size:14px;">Compliance</h1></div></div>
  <main>
    <div class="card"><p style="font-size:12.5px;color:var(--ink-400);">Cross-checks each current club's division against their ground's grade for that standard. ${clubs.length} current clubs checked.</p></div>
    ${section('Non-Compliant \u2014 Ground Fails Their Standard', failing, ({c,g})=>`
      <div class="insp-list-item" data-open-ground="${g.id}">
        <div class="insp-main"><div class="club">${esc(c.clubName)} (${esc(c.status)})</div><div class="meta">${esc(g.groundName||g.clubName||'')} \u2014 Fail</div></div>
      </div>`, 'None \u2014 every current club\'s ground meets their standard or better.')}
    ${section('Passing With Mitigation \u2014 Worth Watching', mitigated, ({c,g})=>`
      <div class="insp-list-item" data-open-ground="${g.id}">
        <div class="insp-main"><div class="club">${esc(c.clubName)} (${esc(c.status)})</div><div class="meta">${esc(g.groundName||g.clubName||'')} \u2014 Pass subject to mitigation</div></div>
      </div>`, 'None.')}
    ${section('No Current Ground / No Grade on Record', noGround, c=>`
      <div class="insp-list-item" data-open-club="${c.id}">
        <div class="insp-main"><div class="club">${esc(c.clubName)} (${esc(c.status)})</div><div class="meta">Can\u2019t assess compliance until a ground is assigned and inspected</div></div>
      </div>`, 'None.')}
  </main>`;
}

  let notices = await Store.listNotices();
  notices = notices.filter(n=>n.resolved).sort((a,b)=> (b.resolvedAt||0)-(a.resolvedAt||0));
  const rows = notices.length ? notices.map(n=>`
    <div class="notice-item">

      <div class="text">${esc(n.text)}</div>

let _searchMapInstance = null;
async function renderSearchMapIfNeeded(){
  if(STATE.searchTab!=='distance' || !STATE.searchResults || !STATE.searchOrigin) return;
  const el = document.getElementById('search-map');
  if(!el || typeof L==='undefined') return;
  if(_searchMapInstance){ _searchMapInstance.remove(); _searchMapInstance = null; }
  const map = L.map(el).setView([STATE.searchOrigin.lat, STATE.searchOrigin.lng], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '\u00a9 OpenStreetMap contributors', maxZoom: 18 }).addTo(map);
  L.circleMarker([STATE.searchOrigin.lat, STATE.searchOrigin.lng], {radius:8, color:'#1c4583', fillColor:'#6feef5', fillOpacity:1, weight:2})
    .addTo(map).bindPopup(`<b>${esc(STATE.searchPostcode.toUpperCase())}</b><br>Search origin`);
  const bounds = [[STATE.searchOrigin.lat, STATE.searchOrigin.lng]];
  for(const r of STATE.searchResults){
    if(r.coords){
      L.marker([r.coords.lat, r.coords.lng]).addTo(map)
        .bindPopup(`<b>${esc(r.ground.groundName||r.ground.clubName||'')}</b><br>${r.distance.toFixed(1)} miles`);
      bounds.push([r.coords.lat, r.coords.lng]);
    }
  }
  if(bounds.length>1) map.fitBounds(bounds, {padding:[30,30]});
  _searchMapInstance = map;
}

function normalizePostcode(pc){ return (pc||'').replace(/\s+/g,'').toUpperCase(); }
function normalizeAddress(a){ return (a||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

function findDuplicateGroundGroups(grounds){
  const active = grounds.filter(g=>!g.mergedInto);
  const groups = [];
  const used = new Set();
  for(let i=0;i<active.length;i++){
    if(used.has(active[i].id)) continue;
    const group = [active[i]];
    for(let j=i+1;j<active.length;j++){
      if(used.has(active[j].id)) continue;
      const pcA = normalizePostcode(active[i].postcode), pcB = normalizePostcode(active[j].postcode);
      const addrA = normalizeAddress(active[i].streetAddress), addrB = normalizeAddress(active[j].streetAddress);
      const pcMatch = pcA && pcA===pcB;
      const addrMatch = addrA && addrA===addrB;
      if(pcMatch || addrMatch){ group.push(active[j]); used.add(active[j].id); }
    }
    if(group.length>1){ groups.push(group); used.add(active[i].id); }
  }
  return groups;
}

async function mergeGroundGroup(group, primaryIdx){
  const primary = group[primaryIdx];
  const duplicates = group.filter((g,i)=>i!==primaryIdx);
  let movedInspections = 0;
  for(const dup of duplicates){
    // merge in any address/owner fields the primary is missing
    ['streetAddress','cityTown','county','postcode','groundOwnerDetails','groundName'].forEach(k=>{
      if(!primary[k] && dup[k]) primary[k] = dup[k];
    });
    // re-point every inspection from the duplicate to the primary
    const inspections = await Api.listInspections(dup.id);
    for(const rec of inspections){
      const insp = parseInspectionRecord(rec);
      insp.groundId = primary.id;
      await Store.saveInspection(insp);
      movedInspections++;
    }
    dup.mergedInto = primary.id;
    await Store.saveGround(dup);
  }
  // recompute primary's current status from whichever of its inspections (now including migrated ones) is most recently approved
  const allInsp = (await Api.listInspections(primary.id)).map(parseInspectionRecord);
  const approved = allInsp.filter(i=>i.status==='approved').sort((a,b)=> (b.facts.visitDate||'').localeCompare(a.facts.visitDate||''));
  if(approved.length){
    const latest = approved[0];
    const grades = computeGrades(latest.facts, latest.overrides||{});
    const summary = summarise(grades);
    primary.currentAssessmentPrem = summary.prem.overall;
    primary.currentAssessmentNonPrem = summary.nonprem.overall;
    primary.currentAssessmentVets = summary.vets.overall;
    primary.lastInspectionDate = latest.facts.visitDate;
    primary.lastInspectionId = latest.id;
  }
  await Store.saveGround(primary);
  return { movedInspections, mergedCount: duplicates.length };
}

const CURRENT_SEASON = '2026/27';
const CLUB_DIVISIONS = ['Prem','Non-Prem','Vets','Not Current'];

async function recordGroundMove(clubName, newGroundId, division, startDate, notes){
  const allTenancies = await Store.listTenancies();
  const currentOthers = allTenancies.filter(t=>t.clubName===clubName && t.status==='current' && t.groundId!==newGroundId);
  for(const t of currentOthers){
    t.status = 'previous';
    t.endDate = startDate || t.endDate || '';
    await Store.saveTenancy(t);
  }
  const existing = allTenancies.find(t=>t.clubName===clubName && t.groundId===newGroundId);
  const rec = existing || {id: uid('tenancy'), groundId:newGroundId, clubName, season: CURRENT_SEASON};
  rec.status = 'current';
  rec.division = division;
  rec.startDate = startDate || rec.startDate || '';
  rec.endDate = '';
  rec.notes = notes || rec.notes || '';
  await Store.saveTenancy(rec);
}

async function renderClubsList(){
  const clubs = await Store.listClubs();
  const tenancies = await Store.listTenancies();
  const grounds = await Store.listAllGroundsIncludingMerged();
  const groundsById = Object.fromEntries(grounds.map(g=>[g.id,g]));
  const q = (STATE.clubSearch||'').trim().toLowerCase();
  const filtered = q ? clubs.filter(c=>(c.clubName||'').toLowerCase().includes(q)) : clubs;
  const sorted = filtered.slice().sort((a,b)=>(a.clubName||'').localeCompare(b.clubName||''));
  const divLabel = d => d && CLUB_DIVISIONS.includes(d) ? d : 'Not Current';
  const groundLabelFor = c => {
    if(c.status==='Not Current') return 'N/A';
    const current = tenancies.filter(t=>t.clubName===c.clubName && t.status==='current');

    return current.map(t=>{ const g = groundsById[t.groundId]; return g ? (g.groundName||g.clubName) : '(ground not found)'; }).join(', ');
  };
  const rows = sorted.length ? sorted.map(c=>`
    <div class="insp-list-item" data-open-club="${c.id}">

/* =========================================================================
   EVENT HANDLING
   ========================================================================= */
function bindGlobalHandlers(){
  const app = document.getElementById('app');

  const saveCfgBtn = app.querySelector('[data-save-config]');
  if(saveCfgBtn) saveCfgBtn.onclick = async ()=>{
    const secret = app.querySelector('#cfg-secret').value.trim();
    setConfig({secret});
    const resultEl = app.querySelector('#setup-result');
    resultEl.textContent = 'Testing connection\u2026';
    try{
      await Api.listGrounds();
      resultEl.textContent = '\u2713 Connected successfully.';
      resultEl.style.color = 'var(--green-600)';
      setTimeout(()=>navigate('dashboard',{}), 600);
    }catch(e){
      resultEl.textContent = '\u2717 Could not connect: ' + e.message;
      resultEl.style.color = 'var(--red-600)';
    }
  };
  const syncBtn = app.querySelector('[data-sync-now]');
  if(syncBtn) syncBtn.onclick = async ()=>{
    showToast('Syncing\u2026');
    const n = await Store.syncAllDirty();
    showToast(n>0 ? `Synced ${n} item(s)` : 'Nothing to sync');
    await render();
  };

  const fixHistBtn = app.querySelector('[data-fix-historical]');
  if(fixHistBtn) fixHistBtn.onclick = async ()=>{
    fixHistBtn.disabled = true;
    const resultEl = app.querySelector('#fix-historical-result');
    resultEl.textContent = 'Starting\u2026 this can take several minutes, please keep this tab open.';
    const all = await Store.listAllInspectionsAnyStatus();
    const targets = all.filter(i=>isHistorical(i.facts.visitDate));
    let done = 0, errors = [];
    resultEl.textContent = `Fixing 0/${targets.length}\u2026`;
    for(const insp of targets){
      try{
        const fixOverrides = computeHistoricalOverrides(insp.facts);
        insp.overrides = Object.assign({}, insp.overrides||{}, fixOverrides);
        await Store.saveInspection(insp);
        if(insp.status==='approved'){
          const grades = computeGrades(insp.facts, insp.overrides);
          const summary = summarise(grades);
          const ground = await Store.getGround(insp.groundId);
          if(ground){
            ground.currentAssessmentPrem = summary.prem.overall;
            ground.currentAssessmentNonPrem = summary.nonprem.overall;
            ground.currentAssessmentVets = summary.vets.overall;
            await Store.saveGround(ground);
          }
        }
        done++;
      }catch(e){ errors.push((insp.facts.clubName||insp.id)+': '+e.message); }
      resultEl.textContent = `Fixed ${done}/${targets.length}\u2026`;
    }
    resultEl.textContent = `Done. Fixed ${done}/${targets.length}.` + (errors.length ? `\n${errors.length} error(s):\n`+errors.slice(0,10).join('\n') : '');
    showToast(`Fixed ${done}/${targets.length} historical inspection(s)`);
    fixHistBtn.disabled = false;
  };

  app.querySelectorAll('[data-start-manual-merge]').forEach(b=>b.onclick=async ()=>{
    STATE.mergingGroundInto = b.dataset.startManualMerge;
    STATE.mergePickerSearch = ''; STATE.mergePickerGroundId = null;
    await render();
  });
  app.querySelectorAll('[data-cancel-manual-merge]').forEach(b=>b.onclick=async ()=>{ STATE.mergingGroundInto=null; await render(); });
  const mergePickerSearchEl = app.querySelector('#merge-picker-search');
  if(mergePickerSearchEl) mergePickerSearchEl.oninput = async ()=>{ STATE.mergePickerSearch = mergePickerSearchEl.value; STATE.mergePickerGroundId=null; await render(); mergePickerSearchEl.focus(); mergePickerSearchEl.setSelectionRange(mergePickerSearchEl.value.length, mergePickerSearchEl.value.length); };
  app.querySelectorAll('[data-pick-merge-target]').forEach(b=>b.onclick=async ()=>{ STATE.mergePickerGroundId = b.dataset.pickMergeTarget; await render(); });
  app.querySelectorAll('[data-confirm-manual-merge]').forEach(b=>b.onclick=async ()=>{
    const sourceId = b.dataset.confirmManualMerge;
    const sourceGround = await Store.getGround(sourceId);
    const targetGround = await Store.getGround(STATE.mergePickerGroundId);
    if(!sourceGround || !targetGround) return;
    b.disabled = true; b.textContent = 'Merging\u2026';
    const { movedInspections } = await mergeGroundGroup([sourceGround, targetGround], 1);
    STATE.mergingGroundInto = null;
    showToast(`Merged \u2014 ${movedInspections} inspection(s) moved`);
    await navigate('ground', {groundId: targetGround.id});
  });

  app.querySelectorAll('[data-manage-tenancies]').forEach(b=>b.onclick=()=>navigate('manage-tenancies',{groundId:b.dataset.manageTenancies}));
  app.querySelectorAll('[data-add-tenancy]').forEach(b=>b.onclick=async ()=>{
    const groundId = b.dataset.addTenancy;
    const ground = await Store.getGround(groundId);
    await Store.saveTenancy({
      id: uid('tenancy'), groundId, clubName:'New Club', season: CURRENT_SEASON, status:'current', division:'', notes:''
    });
    showToast('Club added \u2014 edit the details below');
    await render();
  });
  app.querySelectorAll('[data-tenancy-field]').forEach(el=>{
    const handler = async ()=>{
      const [id, field] = el.dataset.tenancyField.split('|');
      const idx = Local.index('tenancies');
      const t = idx.find(x=>x.id===id);
      if(!t) return;
      t[field] = el.value;
      await Store.saveTenancy(t);
      if(field==='status') await render();
    };
    if(el.tagName==='SELECT') el.onchange = handler; else el.onchange = handler;
  });

  app.querySelectorAll('[data-goto-clubs]').forEach(b=>b.onclick=()=>{ STATE.clubSearch=''; navigate('clubs',{}); });
  app.querySelectorAll('[data-goto-compliance]').forEach(b=>b.onclick=()=>navigate('compliance',{}));
  const groundSearchInput = app.querySelector('#ground-search-input');
  if(groundSearchInput) groundSearchInput.oninput = async ()=>{ STATE.groundSearch = groundSearchInput.value; await render(); groundSearchInput.focus(); groundSearchInput.setSelectionRange(groundSearchInput.value.length, groundSearchInput.value.length); };
  app.querySelectorAll('[data-back-clubs]').forEach(b=>b.onclick=()=>{ STATE.recordingMoveFor=null; STATE.editingTenancyId=null; navigate('clubs',{}); });
  app.querySelectorAll('[data-open-club]').forEach(b=>b.onclick=()=>{ STATE.recordingMoveFor=null; STATE.editingTenancyId=null; navigate('club-detail',{clubId:b.dataset.openClub}); });

  const clubSearchInput = app.querySelector('#club-search-input');
  if(clubSearchInput) clubSearchInput.oninput = async ()=>{ STATE.clubSearch = clubSearchInput.value; await render(); clubSearchInput.focus(); clubSearchInput.setSelectionRange(clubSearchInput.value.length, clubSearchInput.value.length); };

  const newClubBtn = app.querySelector('[data-new-club]');
  if(newClubBtn) newClubBtn.onclick = async ()=>{
    const name = window.prompt('New club name:');
    if(!name || !name.trim()) return;
    const club = { id: uid('club'), clubName: name.trim(), status: 'Not Current', source: 'Manually added', notes: '' };
    await Store.saveClub(club);
    navigate('club-detail', {clubId: club.id});
  };

  app.querySelectorAll('[data-club-field]').forEach(el=>{
    el.onchange = async ()=>{
      const clubs = Local.index('clubs');
      const club = clubs.find(c=>c.id===STATE.clubId);
      if(!club) return;
      club[el.dataset.clubField] = el.value;
      await Store.saveClub(club);
      if(el.dataset.clubField==='status') await render();
    };
  });

  app.querySelectorAll('[data-record-move]').forEach(b=>b.onclick=async ()=>{
    STATE.recordingMoveFor = b.dataset.recordMove;
    STATE.movePickerSearch = ''; STATE.movePickerGroundId = null; STATE.movePickerDate = new Date().toISOString().slice(0,10);
    await render();
  });
  app.querySelectorAll('[data-cancel-move]').forEach(b=>b.onclick=async ()=>{ STATE.recordingMoveFor=null; await render(); });

      const origin = await Geocode.lookupOne(STATE.searchPostcode);
      const radius = parseFloat(STATE.searchRadius) || 10;
      const selectedTiers = TIERS.filter(t=>STATE.searchTiers[t]);
      const grounds = await Store.listGrounds();
      const geoCache = await Geocode.lookupBulk(grounds.map(g=>g.postcode));
      const results = [];
      for(const g of grounds){
        const norm = (g.postcode||'').trim().toUpperCase();
        const coords = geoCache[norm];
        if(!coords) continue;
        const distance = haversineMiles(origin.lat, origin.lng, coords.lat, coords.lng);
        if(distance > radius) continue;
        if(selectedTiers.length){
          const qualifies = selectedTiers.some(t=>{
            const v = g['currentAssessment'+tierKey(t)];
            return v==='Pass' || v==='Pass subject to mitigation';
          });
          if(!qualifies) continue;
        }
        results.push({ground:g, coords, distance});
      }
      results.sort((a,b)=>a.distance-b.distance);
      STATE.searchResults = results;
      STATE.searchOrigin = origin;
    }catch(e){
      STATE.searchError = e.message;

    if(!STATE.amending) return;
    const insp = STATE.cache[STATE.inspectionId];
    if(!insp) { STATE.amending=false; STATE.amenderName=null; STATE.amendOriginalFacts=null; return; }
    const original = STATE.amendOriginalFacts || {};
    const changedKeys = [];
    const allKeys = new Set([...Object.keys(original), ...Object.keys(insp.facts)]);
    for(const k of allKeys){
      if(k.startsWith('_mit_') || k.startsWith('_due_')) continue;
      if((original[k]||'') !== (insp.facts[k]||'')) changedKeys.push(k);
    }
    if(changedKeys.length>0){
      for(const k of changedKeys){
        await Store.saveAmendment({
          id: uid('amend'), inspectionId: insp.id, groundId: insp.groundId,
          clubName: insp.facts.clubName||'', groundName: insp.facts.groundName||'',
          fieldKey: k, oldValue: original[k]||'', newValue: insp.facts[k]||'',
          amendedBy: STATE.amenderName, amendedAt: Date.now()
        });
      }
      insp.lastAmendedBy = STATE.amenderName;
      insp.lastAmendedAt = Date.now();
      await Store.saveInspection(insp);
      if(insp.status==='approved'){
        const grades = computeGrades(insp.facts, insp.overrides||{});
        const summary = summarise(grades);
        const ground = await Store.getGround(insp.groundId);
        if(ground){
          ground.currentAssessmentPrem = summary.prem.overall;
          ground.currentAssessmentNonPrem = summary.nonprem.overall;
          ground.currentAssessmentVets = summary.vets.overall;
          await Store.saveGround(ground);
        }
      }
      showToast(`Amendment saved \u2014 ${changedKeys.length} field(s) changed`);
    }
    STATE.amending = false; STATE.amenderName = null; STATE.amendOriginalFacts = null;
  }

    const grades = computeGrades(insp.facts, insp.overrides);
    const summary = summarise(grades);
    const ground = await Store.getGround(insp.groundId);
    if(ground){
      ground.currentAssessmentPrem = summary.prem.overall;
      ground.currentAssessmentNonPrem = summary.nonprem.overall;
      ground.currentAssessmentVets = summary.vets.overall;
      await Store.saveGround(ground);
    }
    showToast('Approved & finalised');
    await render();
  };

  app.querySelectorAll('[data-notice-due]').forEach(el=>{
    el.onchange = async ()=>{
      const idx = Local.index('notices');
      const n = idx.find(x=>x.id===el.dataset.noticeDue);
      if(n){ n.dueDate = el.value; await Store.saveNotice(n); }
    };
  });
  app.querySelectorAll('[data-goto-resolved-notices]').forEach(b=>b.onclick=()=>navigate('resolved-notices',{}));
  app.querySelectorAll('[data-back-notices]').forEach(b=>b.onclick=()=>navigate('notices',{}));
  app.querySelectorAll('[data-resolve-notice]').forEach(b=>b.onclick=async ()=>{
    const name = window.prompt('Your name (recorded against this resolution for audit purposes):');
    if(!name || !name.trim()) return;
    const idx = Local.index('notices');
    const n = idx.find(x=>x.id===b.dataset.resolveNotice);
    if(!n) return;
    n.resolved = true;
    n.resolvedBy = name.trim();
    n.resolvedAt = Date.now();
    await Store.saveNotice(n);
    showToast('Notice marked resolved');
    await render();
  });
}

async function persistCurrent(silent){
  if(!STATE.inspectionId) return;
  const insp = STATE.cache[STATE.inspectionId];
  if(!insp) return;
  await Store.saveInspection(insp);
  if(!silent) showToast('Saved');
}

/* =========================================================================
   BOOT
   ========================================================================= */
render();
</script>
</body>
</html>
